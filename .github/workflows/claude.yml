name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only allow claude for org members (MEMBER/OWNER)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'OWNER')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: "This is Hera, a PEG parser generator. Run `pnpm build` before `pnpm test`."

          additional_permissions: |
            actions: read

          show_full_output: ${{ runner.debug == '1' }}
          display_report: true
          track_progress: true

          claude_args: |
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(pnpm build:*),Bash(pnpm test:*),Bash(gh pr:*),Bash(gh issue:*)
            --max-turns 100
            --model claude-opus-5-5

      - name: Upload Claude log
        if: always() && steps.claude.outputs.execution_file
        run: aws s3 cp "${{ steps.claude.outputs.execution_file }}" "s3://${{ secrets.CLAUDE_LOG_BUCKET }}/claude-logs/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.log"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
